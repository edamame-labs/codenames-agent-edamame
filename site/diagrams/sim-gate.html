<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sim gate</title>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-ink:     #0f172a;
      --color-muted:   #475569;
      --color-accent:  #b45309;
      --font-sans:     'Atkinson Hyperlegible', system-ui, sans-serif;
      --font-serif:    'Crimson Pro', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Demo</p>
    <h1>Sim gate</h1>
    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sim-gate-title sim-gate-desc">
      <title id="sim-gate-title">Sim gate</title>
      <desc id="sim-gate-desc">A model proposes a clue. Two key-blind listener rankings are combined. An unsafe first step retries or leaves the turn; later risk lowers the number; a clear path plays it.</desc>
      <defs>
        <marker id="sim-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
        <marker id="sim-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b45309"/></marker>
        <marker id="sim-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1e3a5f"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <line x1="480" y1="88" x2="480" y2="120" stroke="#475569" stroke-width="1.2" marker-end="url(#sim-arrow)"/>
      <line x1="480" y1="168" x2="480" y2="200" stroke="#475569" stroke-width="1.2" marker-end="url(#sim-arrow)"/>
      <line x1="480" y1="296" x2="480" y2="328" stroke="#b45309" stroke-width="1.4" marker-end="url(#sim-arrow-accent)"/>
      <line x1="580" y1="248" x2="640" y2="248" stroke="#475569" stroke-width="1.2" marker-end="url(#sim-arrow)"/>
      <line x1="580" y1="376" x2="640" y2="376" stroke="#475569" stroke-width="1.2" marker-end="url(#sim-arrow)"/>
      <line x1="480" y1="424" x2="480" y2="456" stroke="#b45309" stroke-width="1.4" marker-end="url(#sim-arrow-accent)"/>

      <rect x="492" y="304" width="32" height="12" rx="2" fill="#f8fafc"/>
      <text x="508" y="313" fill="#b45309" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAFE</text>
      <rect x="596" y="228" width="40" height="12" rx="2" fill="#f8fafc"/>
      <text x="616" y="237" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNSAFE</text>
      <rect x="596" y="356" width="40" height="12" rx="2" fill="#f8fafc"/>
      <text x="616" y="365" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAMP</text>
      <rect x="492" y="432" width="40" height="12" rx="2" fill="#f8fafc"/>
      <text x="512" y="441" fill="#b45309" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLEAR</text>

      <rect x="380" y="40" width="200" height="48" rx="24" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
      <text x="480" y="68" fill="#0f172a" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', sans-serif" text-anchor="middle">Model proposes</text>

      <rect x="380" y="120" width="200" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
      <text x="480" y="144" fill="#0f172a" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', sans-serif" text-anchor="middle">Two listener rankings</text>
      <text x="480" y="156" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">key-blind</text>

      <polygon points="480,200 580,248 480,296 380,248" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
      <text x="480" y="244" fill="#0f172a" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', sans-serif" text-anchor="middle">First step safe?</text>
      <text x="480" y="260" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ours, not assassin</text>

      <rect x="640" y="224" width="160" height="48" rx="24" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
      <text x="720" y="252" fill="#0f172a" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', sans-serif" text-anchor="middle">Retry or leave</text>

      <polygon points="480,328 580,376 480,424 380,376" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
      <text x="480" y="380" fill="#0f172a" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', sans-serif" text-anchor="middle">Later risk?</text>

      <rect x="640" y="352" width="160" height="48" rx="24" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
      <text x="720" y="380" fill="#0f172a" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', sans-serif" text-anchor="middle">Play smaller n</text>

      <rect x="380" y="456" width="200" height="56" rx="28" fill="rgba(180,83,9,0.08)" stroke="#b45309" stroke-width="1"/>
      <text x="480" y="488" fill="#0f172a" font-size="12" font-weight="700" font-family="'Atkinson Hyperlegible', sans-serif" text-anchor="middle">Play n</text>

      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(15,23,42,0.12)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND · SHAPE CARRIES TYPE</text>
      <rect x="40" y="572" width="24" height="12" rx="6" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
      <text x="72" y="582" fill="#475569" font-size="8" font-family="'Atkinson Hyperlegible', sans-serif">Start / end</text>
      <rect x="200" y="572" width="24" height="12" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
      <text x="232" y="582" fill="#475569" font-size="8" font-family="'Atkinson Hyperlegible', sans-serif">Step</text>
      <polygon points="372,578 384,572 396,578 384,584" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
      <text x="408" y="582" fill="#475569" font-size="8" font-family="'Atkinson Hyperlegible', sans-serif">Decision</text>
      <line x1="520" y1="578" x2="548" y2="578" stroke="#b45309" stroke-width="1.4" marker-end="url(#sim-arrow-accent)"/>
      <text x="556" y="582" fill="#475569" font-size="8" font-family="'Atkinson Hyperlegible', sans-serif">Play path</text>
    </svg>
  </div>
</body>
</html>
