<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="core-title core-desc">
      <title id="core-title">The listener gate</title>
      <desc id="core-desc">The model proposes a clue. A gate checks the predicted listener path against the key, then rejects the clue, shortens it, or plays it.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Crimson+Pro:ital,wght@0,400;0,600;1,400&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      
        <marker id="core-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
        <marker id="core-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b45309"/></marker>
        <marker id="core-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1e3a5f"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <line x1="240" y1="80" x2="240" y2="112" stroke="#475569" stroke-width="1.2" marker-end="url(#core-arrow)"/>
      <path d="M 180,176 V 200 Q 180,208 172,208 H 96 Q 88,208 88,216 V 240" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#core-arrow)"/>
      <line x1="240" y1="176" x2="240" y2="240" stroke="#475569" stroke-width="1.2" marker-end="url(#core-arrow)"/>
      <path d="M 300,176 V 200 Q 300,208 308,208 H 384 Q 392,208 392,216 V 240" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#core-arrow-accent)"/>

      <rect x="140" y="32" width="200" height="48" rx="24" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
      <text x="240" y="60" fill="#0f172a" font-size="16" font-weight="700" font-family="'Atkinson Hyperlegible', sans-serif" text-anchor="middle">Model proposes a clue</text>

      <rect x="140" y="112" width="200" height="64" rx="6" fill="rgba(180,83,9,0.08)" stroke="#b45309" stroke-width="1"/>
      <text x="240" y="140" fill="#0f172a" font-size="16" font-weight="700" font-family="'Atkinson Hyperlegible', sans-serif" text-anchor="middle">Listener gate</text>
      <text x="240" y="160" fill="#475569" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">predicted guesses vs key</text>

      <rect x="24" y="240" width="128" height="56" rx="28" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
      <text x="88" y="264" fill="#0f172a" font-size="16" font-weight="700" font-family="'Atkinson Hyperlegible', sans-serif" text-anchor="middle">Reject</text>
      <text x="88" y="284" fill="#475569" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">unsafe first</text>

      <rect x="176" y="240" width="128" height="56" rx="28" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
      <text x="240" y="264" fill="#0f172a" font-size="16" font-weight="700" font-family="'Atkinson Hyperlegible', sans-serif" text-anchor="middle">Shorten</text>
      <text x="240" y="284" fill="#475569" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">later risk</text>

      <rect x="328" y="240" width="128" height="56" rx="28" fill="rgba(180,83,9,0.08)" stroke="#b45309" stroke-width="1"/>
      <text x="392" y="264" fill="#0f172a" font-size="16" font-weight="700" font-family="'Atkinson Hyperlegible', sans-serif" text-anchor="middle">Play</text>
      <text x="392" y="284" fill="#475569" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">safe path</text>
    </svg>
